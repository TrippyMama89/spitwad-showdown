<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Detention Dodgeball</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#593c31;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}button{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:15px 25px;background:linear-gradient(#fff8db,#ffdc86);border:3px solid #68432b;border-radius:18px;color:#49301e;font-weight:900;font-size:20px;box-shadow:0 5px #6b4c30;z-index:3}button[hidden]{display:none}</style></head><body><canvas id="game"></canvas><button id="start">PLAY DETENTION DODGEBALL!</button><script>
(()=>{'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),btn=document.getElementById('start');let W=0,H=0,dpr=1,blue=0,pink=0,scoreB=0,scoreP=0,ball={x:0,y:0,vx:0,vy:0,r:9},running=false,over=false,flash='',flashUntil=0,last=0,serve=1;const pointers=new Map();let audio;
function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);blue=blue||W/2;pink=pink||W/2;blue=Math.max(48,Math.min(W-48,blue));pink=Math.max(48,Math.min(W-48,pink));if(!running){ball.x=W/2;ball.y=H/2}}addEventListener('resize',size);size();
const width=()=>Math.min(112,Math.max(67,W*.24)),yTop=()=>Math.max(78,H*.13),yBot=()=>H-Math.max(78,H*.13);function clamp(x){return Math.max(width()/2+5,Math.min(W-width()/2-5,x))}function sound(freq,duration=0.09,type='sine'){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(80,freq*.65),audio.currentTime+duration);v.gain.setValueAtTime(.1,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function launch(dir){ball={x:W/2,y:H/2,r:Math.max(7,Math.min(10,W*.022)),vx:(Math.random()-.5)*145,vy:dir*260};running=true;flash='';btn.hidden=true}function reset(){scoreB=0;scoreP=0;over=false;launch(Math.random()<.5?-1:1)}btn.onclick=reset;
// Independent touch identifiers: preserve the proven original prototype's two-player scheme.
 const activeTouches=[null,null];
 function touchStart(e){e.preventDefault();for(const t of e.changedTouches){const i=t.clientY<H/2?0:1;if(activeTouches[i]===null){activeTouches[i]=t.identifier;if(i===0)blue=clamp(t.clientX);else pink=clamp(t.clientX)}}}
 function touchMove(e){e.preventDefault();for(const t of e.changedTouches){if(activeTouches[0]===t.identifier)blue=clamp(t.clientX);if(activeTouches[1]===t.identifier)pink=clamp(t.clientX)}}
 function touchEnd(e){e.preventDefault();for(const t of e.changedTouches){for(let i=0;i<2;i++)if(activeTouches[i]===t.identifier)activeTouches[i]=null}}
 c.addEventListener('touchstart',touchStart,{passive:false});c.addEventListener('touchmove',touchMove,{passive:false});c.addEventListener('touchend',touchEnd,{passive:false});c.addEventListener('touchcancel',touchEnd,{passive:false});
 let mouseDown=false,mouseSide=0;
 c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;mouseDown=true;mouseSide=e.clientY<H/2?0:1;if(mouseSide===0)blue=clamp(e.clientX);else pink=clamp(e.clientX)});
 c.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!mouseDown)return;if(mouseSide===0)blue=clamp(e.clientX);else pink=clamp(e.clientX)});
 addEventListener('pointerup',e=>{if(e.pointerType!=='touch')mouseDown=false});
 let lastVoice=0;
 function sayHit(){try{if(!('speechSynthesis' in window))return;const now=Date.now();if(now-lastVoice<500)return;lastVoice=now;const choices=['Oof!','Ow!','Hey!','My face!'];const word=choices[Math.floor(Math.random()*choices.length)];window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(word);u.lang='en-US';u.rate=1.25;u.pitch=1.22;u.volume=.85;window.speechSynthesis.speak(u)}catch(_){}}
function goal(winner,x){if(winner==='b')scoreB++;else scoreP++;const hit=Math.abs(x-W/2)<W*.23;flash='';if(hit){sound(155,.18,'sawtooth');sayHit()}else{sound(490,.065,'sine')}running=false;if(scoreB>=7||scoreP>=7){over=true;btn.textContent=(scoreB>scoreP?'BLUE':'PINK')+' WINS! PLAY AGAIN';btn.hidden=false}else setTimeout(()=>{if(!over)launch(winner==='b'?1:-1)},900)}
function update(dt){if(!running)return;const prevY=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sound(380,.04)}if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sound(380,.04)}const pw=width();for(const p of [{x:blue,y:yTop(),top:true},{x:pink,y:yBot(),top:false}]){const edge=p.top?p.y+9:p.y-9;if(p.top&&ball.vy<0&&prevY-ball.r>=edge&&ball.y-ball.r<=edge||!p.top&&ball.vy>0&&prevY+ball.r<=edge&&ball.y+ball.r>=edge){if(Math.abs(ball.x-p.x)<=pw/2+ball.r){ball.y=edge+(p.top?ball.r:-ball.r);const off=(ball.x-p.x)/(pw/2);ball.vx=Math.max(-350,Math.min(350,ball.vx*.35+off*235));ball.vy=(p.top?1:-1)*Math.min(570,Math.abs(ball.vy)*1.055+8);sound(570,.07,'square')}}}if(ball.y<-ball.r)goal('p',ball.x);if(ball.y>H+ball.r)goal('b',ball.x)}
function rect(x,y,w,h,color,r=0){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}function line(x1,y1,x2,y2,color,lw=1){g.strokeStyle=color;g.lineWidth=lw;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function star(x,y,r,col){g.save();g.translate(x,y);g.fillStyle=col;g.beginPath();for(let k=0;k<10;k++){const a=k*Math.PI/5-Math.PI/2,rr=k%2?r*.47:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill();g.restore()}
function doodle(x,y,scale,rot,type){g.save();g.translate(x,y);g.rotate(rot);g.scale(scale,scale);g.strokeStyle='#6e483c';g.lineWidth=2;g.lineCap='round';g.lineJoin='round';g.globalAlpha=.52;if(type===0){g.beginPath();g.moveTo(-10,-4);g.lineTo(-3,4);g.lineTo(12,-10);g.stroke();g.beginPath();g.arc(0,0,15,0,Math.PI*2);g.stroke()}if(type===1){g.beginPath();g.moveTo(-12,4);g.quadraticCurveTo(-4,-12,0,2);g.quadraticCurveTo(9,-12,12,4);g.stroke();g.beginPath();g.moveTo(-10,10);g.lineTo(10,10);g.stroke()}if(type===2){g.beginPath();g.moveTo(-12,0);g.lineTo(12,0);g.moveTo(0,-12);g.lineTo(0,12);g.stroke()}g.restore()}
const deskImage = new Image();
deskImage.src = 'detention-desk-flipped.jpg';
function desk(){
if (deskImage.complete && deskImage.naturalWidth) { g.drawImage(deskImage, 0, 0, W, H); return; }
const grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#d9a777');grad.addColorStop(.35,'#c18c5b');grad.addColorStop(.7,'#d5a06d');grad.addColorStop(1,'#b27a50');g.fillStyle=grad;g.fillRect(0,0,W,H);
// warm wood planks with organic fine-grain strokes
for(let i=0;i<7;i++){let x=i*W/6+Math.sin(i*5)*8;line(x,0,x+8,H,'#6f462729',2);line(x+3,0,x+11,H,'#fff3cf25',2)}
for(let i=0;i<95;i++){const x=(i*79.71)%W,y=(i*131.23)%H,len=18+(i*23)%90;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+3,y+len*.33,x-4,y+len*.67,x+2,y+len);g.strokeStyle=i%3===0?'#fff4cf21':'#6e3c2320';g.lineWidth=i%5===0?2:1;g.stroke()}
// edge trim and paper-court inset
rect(7,7,W-14,H-14,'#53332222',15);g.strokeStyle='#70462e88';g.lineWidth=5;g.strokeRect(6,6,W-12,H-12);g.strokeStyle='#f5d3a08a';g.lineWidth=2;g.strokeRect(11,11,W-22,H-22);
const pad=20;g.save();g.setLineDash([8,10]);line(pad,H/2,W-pad,H/2,'#fff0d6bb',2);g.restore();
// faint court target rings
for(const yy of [H*.25,H*.75]){g.strokeStyle='#fce9c433';g.lineWidth=2;g.beginPath();g.arc(W/2,yy,Math.min(W*.23,85),0,Math.PI*2);g.stroke()}
for(const y of [yTop()-37,yBot()+37]){line(15,y,W-15,y,'#ffe5b177',2)}
// classroom stickers and pencil doodles kept clear of play
star(W*.12,H*.28,11,'#ffe2a38a');star(W*.85,H*.73,9,'#f4d2b58c');doodle(W*.14,H*.41,.7,-.22,0);doodle(W*.84,H*.58,.65,.18,1);doodle(W*.86,H*.34,.5,.1,2);
// Subtle hand-drawn accents instead of words on the court.
// tape corners, subtly worn
for(const [x,y,r] of [[21,H*.49,-.14],[W-21,H*.51,.14]]){g.save();g.translate(x,y);g.rotate(r);rect(-10,-6,20,12,'#f5dfa977',2);line(-7,-3,7,-3,'#fff9d34a');g.restore()}
}
const blueHandsImage = new Image();
blueHandsImage.src = 'detention-blue-hands.png';
const pinkHandsImage = new Image();
pinkHandsImage.src = 'detention-pink-hands.png';
function notebook(x,y,top){const w=width(),h=19;g.save();g.translate(x,y);if(top)g.rotate(Math.PI);const blueColor=top?'#347cb4':'#df5b99',light=top?'#6fc3ec':'#ffb3d2',dark=top?'#154c7e':'#9f2d67';
// Forearms point toward their player's own end; the entire object rotates 180 degrees
const handsImage = top ? blueHandsImage : pinkHandsImage;
if (handsImage.complete && handsImage.naturalWidth) {
g.save();
if (top) g.rotate(Math.PI);
g.drawImage(handsImage, -w * 0.88, -w * 0.75, w * 1.76, w * 1.0);
g.restore();
}
// soft contact shadow under book
rect(-w/2+1,-h/2+3,w,h,'#43291c88',4);
// Edge-on book: dark outline, upper colored front cover, paper stack, lower colored back cover
g.shadowColor='#3b241c88';g.shadowBlur=5;g.shadowOffsetY=2;rect(-w/2,-h/2,w,h,'#563f35',3);g.shadowBlur=0;g.shadowOffsetY=0;
rect(-w/2+2,-h/2+1,w-4,5,dark,2);rect(-w/2+3,-h/2+2,w-6,2,light,1);
rect(-w/2+3,-h/2+6,w-6,8,'#f8edcf',1);
for(let j=0;j<4;j++)line(-w/2+6,-h/2+7+j*1.8,w/2-5,-h/2+7+j*1.8,j%2?'#d7c49c':'#fef7e5',.8);
rect(-w/2+2,h/2-5,w-4,4,blueColor,2);line(-w/2+4,h/2-3,w/2-4,h/2-3,light,1);
// tiny spiral at the notebook's LEFT end (top player rotates, so appears on RIGHT)
rect(-w/2-3,-h/2-2,8,h+4,'#56505a',3);rect(-w/2-2,-h/2-1,4,h+2,'#a5a4ac',2);
for(let j=0;j<4;j++){g.beginPath();g.ellipse(-w/2-1,-h/2+2+j*5,4,2.1,0,0,Math.PI*2);g.strokeStyle='#f2f1e9';g.lineWidth=1.7;g.stroke();}
// subtle painted initials on cover edge
line(-w*.17,-h/2+3,w*.1,-h/2+3,'#ffffff55',1);
g.restore()}
function drawBall(){g.save();const r=ball.r;g.shadowColor='#432a1f99';g.shadowBlur=10;g.shadowOffsetY=4;const gr=g.createRadialGradient(ball.x-r*.37,ball.y-r*.43,1,ball.x,ball.y,r);gr.addColorStop(0,'#fff8b6');gr.addColorStop(.22,'#ffde58');gr.addColorStop(.64,'#ff8545');gr.addColorStop(1,'#d94455');g.fillStyle=gr;g.beginPath();g.arc(ball.x,ball.y,r,0,Math.PI*2);g.fill();g.shadowBlur=0;g.shadowOffsetY=0;g.strokeStyle='#9c3a4388';g.lineWidth=1.1;g.stroke();g.fillStyle='#ffffffb0';g.beginPath();g.ellipse(ball.x-r*.3,ball.y-r*.4,r*.26,r*.15,-.6,0,Math.PI*2);g.fill();g.restore()}
function scores(){
// paper label for each score; blue fully rotated for opposing player
function label(x,y,score,top){g.save();g.translate(x,y);if(top)g.rotate(Math.PI);g.shadowColor='#4c2a1d66';g.shadowBlur=5;rect(-27,-21,54,43,'#fff3d6',7);g.shadowBlur=0;g.strokeStyle=top?'#387eae':'#c64c88';g.lineWidth=2;g.strokeRect(-25,-19,50,39);g.fillStyle=top?'#246b9e':'#b73e7a';g.textAlign='center';g.font='900 30px system-ui';g.fillText(String(score),0,12);g.restore()}
label(43,48,scoreB,true);label(W-43,H-48,scoreP,false);
// Keep the playfield clear of text; only the score labels remain.
}
function frame(t){const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);desk();notebook(blue,yTop(),true);notebook(pink,yBot(),false);drawBall();scores();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
