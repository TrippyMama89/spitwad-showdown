<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#7a4b31"><title>Spitwad Showdown</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#221811;touch-action:none;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100dvh;touch-action:none}#help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:85vw;width:330px;text-align:center;background:#fff5dcf2;border:3px solid #63442f;border-radius:20px;padding:22px 18px;box-shadow:0 12px 35px #0008;color:#39251b}#help h1{margin:0 0 8px;font-size:26px}#help p{font-size:15px;line-height:1.45}button{background:#ec679a;color:white;border:0;border-radius:12px;font-weight:800;padding:13px 24px;font-size:18px;cursor:pointer}#reset{position:absolute;top:50%;right:7px;transform:translateY(-50%);background:#fff8e6cc;color:#52321f;font-size:12px;padding:8px 5px;border-radius:9px;writing-mode:vertical-rl;opacity:.85}#help[hidden]{display:none}</style></head><body><canvas id="game"></canvas><button id="reset" aria-label="Restart game">RESTART</button><div id="help"><h1>📓 Spitwad Showdown!</h1><p>Two players, one phone. Place the phone flat between you.<br><br><b>Blue</b> controls the top notebook.<br><b>Pink</b> controls the bottom notebook.<br><br>Slide left and right to block the spitwad. Miss it and your opponent scores! First to <b>7</b> wins.</p><button id="start">PLAY!</button></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),help=document.getElementById('help');let W=0,H=0,dpr=1,playing=false,finished=false,waiting=false,last=0,serveTimer=0;const scores=[0,0],pads=[{x:.5,y:.14,col:'#2875d6',touch:null},{x:.5,y:.86,col:'#e34d91',touch:null}];let ball={x:.5,y:.5,vx:.22,vy:.46,r:8},particles=[];const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const rand=(a,b)=>a+Math.random()*(b-a);let paddleW=100,paddleH=30,ballR=10,goalGap=42;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);paddleW=clamp(W*.28,72,132);paddleH=clamp(H*.044,25,39);ballR=clamp(W*.025,8,13);goalGap=clamp(H*.055,30,55);pads[0].y=(goalGap+paddleH*.8)/H;pads[1].y=1-pads[0].y;}addEventListener('resize',resize);resize();function serve(dir){ball.x=.5;ball.y=.5;ball.vx=rand(-.22,.22);ball.vy=dir*rand(.36,.44);waiting=true;serveTimer=.8;}function reset(){scores[0]=scores[1]=0;finished=false;playing=true;pads.forEach(p=>{p.x=.5;p.touch=null});serve(Math.random()<.5?-1:1);help.hidden=true;}document.getElementById('start').onclick=reset;document.getElementById('reset').onclick=reset;function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function line(x,y,X,Y,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}function hand(x,y,flip){ctx.save();ctx.translate(x,y);if(flip)ctx.scale(1,-1);ctx.fillStyle='#e6a77c';ctx.strokeStyle='#a9684d';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-13,-5,25,39,10);ctx.fill();ctx.stroke();roundRect(-11,2,12,20,6,'#f0b88f','#a9684d');ctx.restore()}function drawPaddle(p,i){let x=p.x*W,y=p.y*H;ctx.save();ctx.translate(x,y);if(i===0)ctx.rotate(Math.PI);const color=i===0?'#2875d6':'#e34d91',dark=i===0?'#134681':'#963260';const sleeve=i===0?'#2164b8':'#d83f83';roundRect(-paddleW*.58,paddleH*.13,paddleW*1.16,paddleH*.8,9,'#6b3b2780');roundRect(-paddleW*.52,-paddleH*.4,paddleW*1.04,paddleH*.95,7,'#fff9e6','#755442');roundRect(-paddleW*.5,-paddleH*.45,paddleW,paddleH*.9,6,color,dark);ctx.strokeStyle='#f9f3e9';ctx.lineWidth=2;for(let j=0;j<12;j++){let xx=-paddleW*.44+j*paddleW*.08;ctx.beginPath();ctx.arc(xx,paddleH*.43,3.5,0,Math.PI);ctx.stroke()}ctx.font=`${Math.round(paddleH*.65)}px sans-serif`;ctx.textAlign='center';ctx.fillText(i===0?'⚡':'♥',0,-paddleH*.08);roundRect(-paddleW*.66,paddleH*.27,18,42,8,sleeve);roundRect(paddleW*.66-18,paddleH*.27,18,42,8,sleeve);hand(-paddleW*.57,paddleH*.04,false);hand(paddleW*.57,paddleH*.04,false);ctx.restore()}function scoreBadge(i){let x=i===0?16:W-62,y=i===0?15:H-66;ctx.save();if(i===0){ctx.translate(x+23,y+24);ctx.rotate(Math.PI);ctx.translate(-23,-24);x=0;y=0;}roundRect(x,y,47,49,8,'#fff2db','#c8a781');ctx.fillStyle=i===0?'#2875d6':'#d8397b';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 30px system-ui';ctx.fillText(scores[i],x+23.5,y+24.5);ctx.restore()}function draw(){const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#d79a59');bg.addColorStop(.5,'#c9894e');bg.addColorStop(1,'#a96b3e');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#8a542b35';for(let k=0;k<Math.ceil(H/20);k++){let y=k*20+8;ctx.beginPath();ctx.moveTo(0,y);ctx.bezierCurveTo(W*.25,y+5,W*.65,y-6,W,y+2);ctx.stroke()}ctx.strokeStyle='#fff0cf';ctx.lineWidth=3;ctx.setLineDash([12,13]);ctx.beginPath();ctx.moveTo(8,H/2);ctx.lineTo(W-8,H/2);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#9d542b88';ctx.lineWidth=3;ctx.strokeRect(4,4,W-8,H-8);ctx.font=`${Math.min(27,W*.07)}px sans-serif`;ctx.globalAlpha=.26;ctx.fillText('✎',W*.1,H*.36);ctx.fillText('☆',W*.82,H*.31);ctx.fillText('✘',W*.16,H*.68);ctx.fillText('☻',W*.78,H*.74);ctx.globalAlpha=1;scoreBadge(0);scoreBadge(1);drawPaddle(pads[0],0);drawPaddle(pads[1],1);ctx.save();ctx.translate(ball.x*W,ball.y*H);ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(2,4,ballR+2,ballR*.85,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7ed';ctx.strokeStyle='#a5a0a1';ctx.lineWidth=1.5;ctx.beginPath();for(let i=0;i<11;i++){let a=i*Math.PI*2/11,r=ballR*(i%3===0?1.06:.87);let x=Math.cos(a)*r,y=Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.closePath();ctx.fill();ctx.stroke();line(-ballR*.6,-2,1,ballR*.35,'#b7b0b0',1);line(0,-ballR*.5,ballR*.6,1,'#b7b0b0',1);ctx.restore();for(const p of particles){ctx.globalAlpha=p.life/.35;ctx.fillStyle='#fff7e8';ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(finished){ctx.fillStyle='#2e1b13bd';ctx.fillRect(0,H*.36,W,H*.28);ctx.fillStyle='white';ctx.textAlign='center';ctx.font=`900 ${Math.min(28,W*.07)}px system-ui`;ctx.fillText((scores[0]>scores[1]?'BLUE':'PINK')+' WINS!',W/2,H*.47);ctx.font='bold 15px system-ui';ctx.fillText('Tap RESTART to play again',W/2,H*.53)}else if(waiting&&playing){ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillStyle='#fff6e6';ctx.fillText('READY?',W/2,H*.58)}}function bounceFx(x,y){for(let i=0;i<7;i++)particles.push({x,y,vx:rand(-80,80),vy:rand(-80,80),life:.35})}function point(winner){scores[winner]++;if(scores[winner]>=7){finished=true;playing=false;waiting=false;return}serve(winner===0?1:-1)}function update(dt){for(let j=particles.length-1;j>=0;j--){let p=particles[j];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.life<=0)particles.splice(j,1)}if(!playing||finished)return;if(waiting){serveTimer-=dt;if(serveTimer<=0)waiting=false;return}let bx=ball.x*W,by=ball.y*H;bx+=ball.vx*W*dt;by+=ball.vy*H*dt;if(bx<ballR){bx=ballR;ball.vx=Math.abs(ball.vx);bounceFx(bx,by)}if(bx>W-ballR){bx=W-ballR;ball.vx=-Math.abs(ball.vx);bounceFx(bx,by)}for(let i=0;i<2;i++){const p=pads[i],py=p.y*H,px=p.x*W,half=paddleW/2;const touchingX=Math.abs(bx-px)<half+ballR*.45;if(i===0&&ball.vy<0&&by-ballR<=py+paddleH*.42&&by>py-paddleH*.8&&touchingX){by=py+paddleH*.42+ballR;ball.vy=Math.abs(ball.vy)*1.035;ball.vx=clamp(ball.vx+(bx-px)/half*.13,-.55,.55);bounceFx(bx,by)}if(i===1&&ball.vy>0&&by+ballR>=py-paddleH*.42&&by<py+paddleH*.8&&touchingX){by=py-paddleH*.42-ballR;ball.vy=-Math.abs(ball.vy)*1.035;ball.vx=clamp(ball.vx+(bx-px)/half*.13,-.55,.55);bounceFx(bx,by)}}ball.x=bx/W;ball.y=by/H;if(by<-ballR)point(1);if(by>H+ballR)point(0)}function tick(t){let dt=Math.min((t-last)/1000||0,.034);last=t;update(dt);draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);function touchStart(e){e.preventDefault();for(const t of e.changedTouches){const i=t.clientY<H/2?0:1;const p=pads[i];if(p.touch===null){p.touch=t.identifier;p.x=clamp(t.clientX/W,paddleW/(2*W)+.03,1-paddleW/(2*W)-.03)}}}function touchMove(e){e.preventDefault();for(const t of e.changedTouches){for(const p of pads)if(p.touch===t.identifier)p.x=clamp(t.clientX/W,paddleW/(2*W)+.03,1-paddleW/(2*W)-.03)}}function touchEnd(e){e.preventDefault();for(const t of e.changedTouches)for(const p of pads)if(p.touch===t.identifier)p.touch=null}c.addEventListener('touchstart',touchStart,{passive:false});c.addEventListener('touchmove',touchMove,{passive:false});c.addEventListener('touchend',touchEnd,{passive:false});c.addEventListener('touchcancel',touchEnd,{passive:false});let mouseDown=false;c.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;mouseDown=true;moveMouse(e)});c.addEventListener('pointermove',e=>{if(mouseDown)moveMouse(e)});addEventListener('pointerup',()=>mouseDown=false);function moveMouse(e){let p=pads[e.clientY<H/2?0:1];p.x=clamp(e.clientX/W,paddleW/(2*W)+.03,1-paddleW/(2*W)-.03)}addEventListener('keydown',e=>{let speed=.055;if(e.key==='a'||e.key==='A')pads[0].x=clamp(pads[0].x-speed,.2,.8);if(e.key==='d'||e.key==='D')pads[0].x=clamp(pads[0].x+speed,.2,.8);if(e.key==='ArrowLeft')pads[1].x=clamp(pads[1].x-speed,.2,.8);if(e.key==='ArrowRight')pads[1].x=clamp(pads[1].x+speed,.2,.8)});})();
</script></body></html>
